# Builds the Windows and macOS installers and attaches them to a GitHub release.
# Start it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# The README links to releases/latest/download/<file>, so the file names below
# must stay fixed (they're set by artifactName in package.json).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds the installers as workflow artifacts only

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/crunchpad-Setup.exe
          - os: macos-latest
            target: --mac
            files: release/crunchpad-mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificate: build unsigned (macOS gets an ad-hoc signature).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
